
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ramzfort"
version = "0.1.0"
description = "A modular and secure Python password generator and manager."
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ramzfort*"]
namespaces = false

[tool.ruff]
target-version = "py315"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/ramzfort", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
